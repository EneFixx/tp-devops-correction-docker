# .github/workflows/main.yml
# TP2 - CI/CD : tests du backend, analyse SonarCloud, puis build et publication des images
name: CI - Test backend

on:
  # Lance le pipeline à chaque push sur main et develop
  push:
    branches:
      - main
      - develop
  # Et à chaque pull request
  pull_request:

jobs:
  test-backend:
    # Machine virtuelle Ubuntu fournie par GitHub
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du repo, avec tout l'historique Git
      # (SonarCloud s'en sert pour attribuer les problèmes aux commits)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installe le JDK 21 (même version que le pom.xml)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compile, lance les tests unitaires et les tests d'intégration (Testcontainers)
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml

      # Analyse la qualité du code avec SonarCloud (Quality Gate)
      # Le token est lu depuis le secret SONAR_TOKEN pour ne pas l'écrire en clair
      - name: SonarCloud analysis
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=EneFixx_tp-devops-correction-docker
          -Dsonar.organization=enefixx
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          --file ./simple-api/pom.xml

  build-and-push-docker-image:
    # Ne se lance que si le job test-backend a réussi
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Connexion à Docker Hub avec les secrets du repo
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construit et publie l'image du backend (publication uniquement sur main)
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Construit et publie l'image de la base de données
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Construit et publie l'image du serveur Apache
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Construit et publie l'image du front
      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest
          push: ${{ github.ref == 'refs/heads/main' }}
