# .github/workflows/ci.yml
# TP2 - Intégration continue : tests du backend
name: CI - Test backend

on:
  # Lance les tests à chaque push sur main et develop
  push:
    branches:
      - main
      - develop
  # Et à chaque pull request
  pull_request:

jobs:
  test-backend:
    # Machine virtuelle Ubuntu fournie par GitHub
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du repo
      - uses: actions/checkout@v4

      # Installe le JDK 21 (même version que le pom.xml)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compile, lance les tests unitaires et les tests d'intégration (Testcontainers)
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml