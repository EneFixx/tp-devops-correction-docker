
name: Deploy - Ansible (TP3)

on:
  # Se lance quand les images ont été publiées sur Docker Hub
  workflow_run:
    workflows: ["CD - Build and push images"]
    types: [completed]
    branches: [main]
  # Permet aussi de lancer le déploiement à la main depuis l'onglet Actions
  workflow_dispatch:

jobs:
  deploy:
    # Ne déploie que si la publication des images a réussi (ou si lancé à la main)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Installe Python puis Ansible sur la machine de GitHub
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible

      # Recrée la clé SSH à partir du secret
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Lance le playbook sur le serveur
      - name: Run Ansible playbook
        working-directory: ./ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i inventories/setup.yml playbook.yml -e ansible_ssh_private_key_file=$HOME/.ssh/id_rsa