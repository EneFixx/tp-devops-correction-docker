# .github/workflows/deploy.yml
# TP3 - Déploiement sur le serveur avec Ansible
# Désactivé automatiquement pour le TP2 : se lance uniquement à la main depuis l'onglet Actions
name: Deploy - Ansible (TP3)

on:
  # Déploiement manuel uniquement (bouton "Run workflow" dans l'onglet Actions)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Installe Python puis Ansible sur la machine de GitHub
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible

      # Recrée la clé SSH à partir du secret
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Lance le playbook sur le serveur
      - name: Run Ansible playbook
        working-directory: ./ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i inventories/setup.yml playbook.yml -e ansible_ssh_private_key_file=$HOME/.ssh/id_rsa
