- hosts: all
  gather_facts: true
  become: true

  tasks:
    # Installe les paquets necessaires pour ajouter le depot Docker
    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-venv
        state: latest
        update_cache: yes

    # Ajoute la cle GPG officielle de Docker (pour verifier les paquets)
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    # Ajoute le depot officiel de Docker pour Debian
    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable"
        state: present
        update_cache: yes

    # Installe Docker
    - name: Install Docker
      apt:
        name: docker-ce
        state: present

    # Installe Python3 et pip3
    - name: Install Python3 and pip3
      apt:
        name:
          - python3
          - python3-pip
        state: present

    # Cree un environnement virtuel Python pour le SDK Docker
    - name: Create a virtual environment for Docker SDK
      command: python3 -m venv /opt/docker_venv
      args:
        creates: /opt/docker_venv

    # Installe le SDK Docker pour Python (utilise plus tard par Ansible pour lancer les conteneurs)
    - name: Install Docker SDK for Python in virtual environment
      command: /opt/docker_venv/bin/pip install docker

    # Verifie que Docker tourne
    - name: Make sure Docker is running
      service:
        name: docker
        state: started
      tags: docker
